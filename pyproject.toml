[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twiddler-tools"
version = "0.1.0"
description = "Tooling around the TekGear Twiddler 4 chording keyboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4",
    "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
twiddler-tools = "twiddler_tools.gui.app:main"

[tool.setuptools.packages.find]
include = ["twiddler_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
